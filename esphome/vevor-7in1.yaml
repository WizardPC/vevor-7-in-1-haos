# ---------------------------------------------------------------------------
# Vevor 7-in-1 (868 MHz) -> Home Assistant, via CC1101 + ESP32-C3 SuperMini.
#
# Ce fichier ne contient AUCUNE logique métier : uniquement le câblage, les logs
# et la déclaration des entités. Tout le décodage vit dans le composant externe
# components/vevor_7in1/.
#
# Fichier PUBLIE : le composant est tire directement du depot GitHub. C'est ce
# fichier qu'un utilisateur copie tel quel.
# ---------------------------------------------------------------------------

esphome:
  name: vevor-7in1
  friendly_name: Vevor 7-in-1

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Pas d'encryption (développement).
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Adresse fixe imposee. Aucune section 'ap:' : pas de repli Access Point.
  use_address: 172.16.0.205
  # Puissance TX du Wi-Fi au minimum. 8.5 est la borne basse acceptee, et le
  # suffixe 'dB' n'est valide que sur le composant wifi (cv.decibel). Le
  # output_power du CC1101, lui, est un flottant nu en dBm sans unite.
  output_power: 8.5dB

external_components:
  - source: github://WizardPC/vevor-7-in-1-haos@main
    components: [vevor_7in1]
    refresh: 0s

# --- Bus SPI (impose) -------------------------------------------------------
# ATTENTION : `cs_pin` n'est PAS une option valide du bloc `spi:` en ESPHome
# 2026.9.1 (le schema n'accepte que clk_pin / mosi_pin / miso_pin). Le chip
# select se declare sur le peripherique : voir `cc1101: cs_pin`. Le brochage
# voulu est donc conserve, seul l'emplacement de la cle change.
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

# --- Radio CC1101 -----------------------------------------------------------
# Il n'existe pas de key `async_mode` : le mode async est obtenu par
# `packet_mode: false` (defaut). Le CC1101 demodule alors et sort le signal
# serie sur GDO0 (registre GDO0_CFG = 0x0D), cable sur GPIO3 ou le
# remote_receiver capture les fronts. Le lien entre les deux composants est
# purement materiel.
cc1101:
  cs_pin: GPIO7
  # HYPOTHESE : la source rtl_433 ne documente un centre mesure que pour la
  # variante US (915.031 MHz). A confirmer par une capture reelle.
  frequency: 868.35MHz
  modulation_type: 2-FSK
  symbol_rate: 11260        # ~11.26 kbaud
  fsk_deviation: 37kHz      # +-37 kHz
  filter_bandwidth: 101kHz  # ~2 x (deviation + debit/2)
  packet_mode: false

# --- Capture des timings bruts (GDO0) ---------------------------------------
remote_receiver:
  id: rf_receiver
  pin:
    number: GPIO3
  dump: raw                 # mise au point : a retirer en production
  idle: 9ms                 # equivalent du reset_limit rtl_433 (9000 us)
  # `filter` par defaut = 50 us : sans effet sur des bits de 88.8 us, et c'est
  # volontaire. L'augmenter fusionnerait des impulsions legitimes.
  receive_symbols: 192      # marge memoire RMT (defaut 96 symboles sur ESP32-C3)

# --- Entites exposees a Home Assistant --------------------------------------
# Une seule plateforme porte tout (meme approche que `bme280`) : les entites
# numeriques, binaires et textuelles sont imbriquees sous la meme cle.
sensor:
  - platform: vevor_7in1
    remote_receiver_id: rf_receiver

    # Donnees de la station
    temperature:
      name: "Vevor temperature"
    humidity:
      name: "Vevor humidite"
    wind_speed:
      name: "Vevor vent moyen"
    wind_gust:
      name: "Vevor rafale"
    wind_direction:
      name: "Vevor direction du vent"
    rain_total:
      name: "Vevor pluie cumulee"
    uv_index:
      name: "Vevor indice UV"
    illuminance:
      name: "Vevor luminosite"

    # Diagnostic
    frame_age:              # watchdog : secondes depuis la derniere trame valide
      name: "Vevor age derniere trame"
    signal_quality:         # ratio de trames conformes / trames attendues
      name: "Vevor qualite du signal"
    frames_valid:
      name: "Vevor trames valides"
    frames_invalid:
      name: "Vevor trames rejetees"
    bit_period:
      name: "Vevor periode de bit"

    # Entites non numeriques
    battery_low:
      name: "Vevor batterie faible"
    station_id:
      name: "Vevor identifiant"
    last_status:
      name: "Vevor dernier statut"
